# Merge report: on a push to the main branch, tell Cladeo which pull request was merged as the
# pushed commit, so the task of that pull request moves to done. Called from each repository's
# own workflow:
#
#   merge-report:
#     if: github.event_name == 'push'
#     uses: Hugo-SEQUIER/ci-workflows/.github/workflows/merge-report.yml@v1
#     permissions:
#       contents: read
#       pull-requests: read      # to ask GitHub for the pull request of the commit
#     with:
#       runs-on: '["self-hosted","<repo label>"]'
#       cladeo-url: ${{ vars.CLADEO_URL }}
#     secrets:
#       CLADEO_KEY: ${{ secrets.CLADEO_KEY }}
#
# A push that merged no pull request sends nothing. The key is never printed. The contract is in
# Hugo-SEQUIER/systems, docs/AGENT_INTERFACE.md#merge-report-and-merge-check.
name: merge-report

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels, for example '["self-hosted","gta6"]'
        type: string
        required: true
      cladeo-url:
        description: Address of the Cladeo install, for example https://app.cladeo.dev
        type: string
        required: true
      ci-ref:
        description: Ref of Hugo-SEQUIER/ci-workflows whose scripts to use; keep it equal to the ref in `uses:`
        type: string
        default: v1
    secrets:
      CLADEO_KEY:
        description: A Cladeo agent key of the account that holds the tasks
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-report:
    name: merge report
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Hugo-SEQUIER/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci-workflows
      - name: Report the merged pull request to Cladeo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLADEO_URL: ${{ inputs.cladeo-url }}
          CLADEO_KEY: ${{ secrets.CLADEO_KEY }}
        run: python3 .ci-workflows/scripts/merge_report.py
